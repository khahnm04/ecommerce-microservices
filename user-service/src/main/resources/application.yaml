server:
  port: 8080

spring:
  application:
    name: user-service
  config:
    import: "optional:file:./user-service/.env[.properties]"
  datasource:
    url: jdbc:postgresql://localhost:5433/user_service
    username: root
    password: root
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    database-platform: org.hibernate.dialect.PostgreSQLDialect
  data:
    redis:
      host: localhost
      port: 6379

jwt:
  secret-key: ${SECRET_KEY}
